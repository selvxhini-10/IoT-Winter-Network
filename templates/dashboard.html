<!DOCTYPE html>
<html>
<head>
    <title>Snow/Ice Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.4723, -80.5449], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        async function fetchData() {
            const response = await fetch('/points');
            const points = await response.json();

            points.forEach(point => {
                let color = (point.distance < 10 || point.temperature <= 1) ? 'red' : 'green';
                L.circleMarker([point.lat, point.lon], {
                    radius: 8,
                    color: color,
                    fillOpacity: 0.7
                }).addTo(map).bindPopup(
                    `Distance: ${point.distance} cm<br>Temp: ${point.temperature} °C`
                );
            });
        }

        setInterval(fetchData, 2000); // refresh every 2 seconds
    </script>
</body>
</html>
